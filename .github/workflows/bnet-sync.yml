# Hourly Battle.net Profile API pull -> docs/sync/bnet.json (see tools/bnet-fetch.mjs).
# Secrets (repo Settings > Secrets and variables > Actions): BNET_CLIENT_ID, BNET_CLIENT_SECRET,
# BNET_REALM, BNET_CHARACTER. Optional repo variable BNET_REGION (default us).
name: Battle.net sync

on:
  schedule:
    - cron: "17 * * * *"   # off the hour; GitHub queues :00 jobs heavily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bnet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch profile data
        env:
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          BNET_REALM: ${{ secrets.BNET_REALM }}
          BNET_CHARACTER: ${{ secrets.BNET_CHARACTER }}
          BNET_REGION: ${{ vars.BNET_REGION }}
        run: node tools/bnet-fetch.mjs

      # Rebase before push: tools/sync.ps1 pushes to main from the PC, so the two can race.
      - name: Commit if changed
        run: |
          git add docs/sync/bnet.json
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "sync: battle.net profile"
          git pull --rebase --quiet origin main
          git push
